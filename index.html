<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Projeto17-Design de cartão</title>
</head>
<body>
    <div class="titulo">
        <h1>Cartão de Crédito</h1>
    </div>
    <div class="container">
        <header>
            <span class="logo">
                <img src="img/logo.png" alt="">
                <h5>Master Card</h5>
            </span>
            <img src="img/chip.png" alt="" class="chip">
        </header>

        <div class="detalhes">
            <div class="numero">
                <h6>Número do cartão</h6>
                <h5 class="número">1234 5678 9012 3456</h5>
                <h5 class="nome">JOÃO DA SILVA</h5>
            </div>
            <div class="validade">
                <h6>Válido até</h6>
                <h5>12/27</h5>
            </div>
        </div>
    </div>
</body>
</html>
